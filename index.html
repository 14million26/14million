<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>١٤ مليون</title>
<meta name="description" content="أخبار المصريين بالخارج: ما قالته الدولة، وما حدث فعلاً.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light">
<script>(function(){try{var t=localStorage.getItem("theme14");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="color-scheme"]');if(m)m.setAttribute("content","dark");}}catch(e){}})();</script>
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Noto+Kufi+Arabic:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;
  /* layout: white page, black hairline top bar, orange numeral masthead, sticky category rail, lead story, grid of cards; each opens a white article sheet over an orange backdrop */
  --paper:#ffffff; --card:#ffffff; --ink:#111111; --muted:#5f5f5f; --line:#e7e7e7; --soft:#fff4ee;
  --flame:#f4511e; --flame-2:#ff8f00; --ember:#c62a12; --on-flame:#ffffff;
  --c-said:#111111; --c-real:#f4511e; --c-gap:#ff8f00; --c-rights:#c62a12; --c-money:#8a3b12;
  --font-mast:"Rakkas","Noto Kufi Arabic",Tahoma,serif;
  --font-head:"Noto Kufi Arabic",Tahoma,sans-serif;
  --font-body:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);
  --rail-bg:rgba(255,255,255,.94); --pressed:#111111; --plain:#f5f5f5; --art:#ffffff; --file:#111111; --btn:#ffffff;
}
html[data-theme="dark"] body{color-scheme:dark}
:root[data-theme="dark"]{--paper:#121212; --card:#1c1c1c; --ink:#ececec; --muted:#a9a9a9; --line:#2e2e2e; --soft:#2a1d17; --c-said:#4a4a4a; --pressed:#3a3a3a; --rail-bg:rgba(18,18,18,.94); --plain:#232323; --art:#1a1a1a; --file:#262626; --btn:#232323; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.85;color-scheme:light}
a{color:var(--ember)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.topbar{height:6px;background:#111}
.mast{background:var(--paper);border-bottom:1px solid var(--line)}
.mast-in{max-width:1180px;margin:0 auto;padding:22px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mast img{width:60px;height:60px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--flame)}
.mast h1{font-family:var(--font-mast);font-weight:400;font-size:clamp(2.8rem,10vw,4.6rem);line-height:1;margin:0;color:var(--flame)}
.mast .stamp{font-family:var(--font-head);font-size:.78rem;color:var(--muted);margin:0}
.rail{position:sticky;top:0;z-index:5;background:var(--rail-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rail-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 420px}
.cats::-webkit-scrollbar{display:none}
.cat{font-family:var(--font-head);font-size:.86rem;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.cat:hover{border-color:var(--flame)}
.sort{display:flex;align-items:center;gap:4px;font-family:var(--font-head);font-size:.8rem;color:var(--muted)}
.sort .cat{padding:4px 12px;font-size:.8rem}
.sort .cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat[aria-pressed="true"]{background:var(--k,var(--pressed));border-color:var(--k,var(--pressed));color:var(--on-flame)}
.tools{display:flex;gap:8px;flex:1 1 280px}
.tools input,.tools select{font-family:var(--font-head);font-size:.86rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.tools input{flex:1}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:26px}
.lead{display:grid;grid-template-columns:1.25fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);border-top:5px solid var(--flame)}
.lead .lead-text{min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.lead h2{font-family:var(--font-head);font-weight:800;font-size:clamp(1.35rem,3.2vw,2rem);line-height:1.5;margin:0;text-wrap:balance}
.lead p{margin:0;color:var(--muted)}
@media (max-width:760px){.lead{grid-template-columns:1fr}.art-in{padding:16px 16px 24px}}
.sheet{padding:24px 10px}
.theme-btn{font-family:var(--font-head);font-size:.85rem;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;line-height:1.6}
.theme-btn:hover{border-color:var(--flame);color:var(--flame)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;text-align:start;padding:0;transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:var(--flame)}
.card .txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:var(--font-head);font-weight:600;font-size:1.04rem;line-height:1.65;margin:0;text-wrap:balance}
.card .ex{margin:0;color:var(--muted);font-size:.93rem;line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--font-head);font-size:.74rem;color:var(--muted)}
.pill{color:var(--on-flame);background:var(--k);border-radius:999px;padding:1px 10px;font-weight:600}
.urg.pin{background:#111}
.urg{color:#fff;background:var(--ember);border-radius:4px;padding:1px 8px;font-weight:800;letter-spacing:.02em}
.fade{border:1px solid currentColor;border-radius:999px;padding:0 8px}
.fade.last{color:var(--ember)}
.cover{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:var(--k)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{background:linear-gradient(140deg,var(--flame-2),var(--flame) 60%,var(--ember));display:flex;align-items:flex-end;padding:14px 16px}
.cover.gen.dark{background:linear-gradient(140deg,#2a2a2a,#0d0d0d)}
.cover.gen .w{font-family:var(--font-mast);color:#fff;font-size:2.4rem;line-height:1}
.cover.gen .k{position:absolute;top:12px;inset-inline-start:14px;font-family:var(--font-head);font-size:.75rem;color:rgba(255,255,255,.88)}
.cover.gen::after{content:"١٤";position:absolute;inset-inline-end:-6px;bottom:-34px;font-family:var(--font-mast);font-size:9rem;color:rgba(255,255,255,.12);line-height:1}
.lead .cover{aspect-ratio:auto;min-height:240px;height:100%}
.more{align-self:center;font-family:var(--font-head);font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 28px;cursor:pointer}
.more:hover{background:var(--flame)}
.empty{font-family:var(--font-head);color:var(--muted);text-align:center;padding:40px 0}
footer{background:#111;color:#d6d6d6;font-family:var(--font-head);font-size:.8rem;line-height:1.9}
footer .in{max-width:1180px;margin:0 auto;padding:22px 16px 30px}
.sheet{position:fixed;inset:0;overflow-x:hidden;z-index:20;display:none;background:linear-gradient(155deg,rgba(255,143,0,.96),rgba(244,81,30,.96));overflow-y:auto;padding:24px 12px}
.sheet[data-open="1"]{display:block}
.art{max-width:min(760px,100%);margin:0 auto;background:var(--art);color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.art .cover{aspect-ratio:16/8}
.art-in{min-width:0;overflow-wrap:anywhere;padding:20px 26px 30px;display:flex;flex-direction:column;gap:14px}
.art h2{font-family:var(--font-head);font-weight:800;font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.55;margin:0;text-wrap:balance}
.story p{margin:0 0 14px;max-width:66ch}
.story p.take{font-weight:600;border-inline-start:4px solid var(--flame);padding-inline-start:14px;margin-top:6px}
.credit{margin:0;padding:4px 14px;font-family:var(--font-head);font-size:.72rem;color:var(--muted);text-align:left;direction:ltr}
.credit a{color:var(--muted)}
.pol{white-space:pre-line;font-size:1.08rem;line-height:1.95;margin:0}
.plain{background:var(--plain);border-radius:14px;padding:14px 18px}
.plain p{margin:0 0 10px;max-width:66ch}.plain p:last-child{margin:0}
.srcs{font-family:var(--font-head);font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.srcs ul{margin:4px 0 0;padding-inline-start:18px}
.srcs a{word-break:break-word}
.art-bar{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--font-head);font-size:.85rem}
.art-bar button{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
.art-bar button:hover{border-color:var(--flame);color:var(--flame)}
.files{display:flex;flex-direction:column;gap:12px}
.files-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:8px}
.files-head h2{font-family:var(--font-mast);font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1;margin:0;color:var(--ink)}
.files-head p{margin:0;font-family:var(--font-head);font-size:.85rem;color:var(--muted)}
.files-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px}
.file{background:var(--file);color:#fff;border:0;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:start;padding:0;box-shadow:var(--shadow);transition:transform .25s ease}
.file:hover{transform:translateY(-3px)}
.file .txt{padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px}
.file h3{font-family:var(--font-head);font-weight:800;font-size:1.08rem;line-height:1.6;margin:0;text-wrap:balance}
.file .ex{margin:0;color:#d6d6d6;font-size:.92rem;line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.file .meta{color:#bdbdbd}
.tag{color:#fff;background:var(--flame);border-radius:4px;padding:1px 8px;font-weight:800}
.rep h3{font-family:var(--font-head);font-weight:800;font-size:1.15rem;margin:18px 0 8px;padding-inline-start:12px;border-inline-start:4px solid var(--flame)}
.rep p{margin:0 0 12px;max-width:66ch}
.rep .lede{font-size:1.1rem;font-weight:600;background:var(--soft);border-radius:14px;padding:14px 18px;max-width:none}
.rep h3.hope{border-color:#1b7f3b}
.rep{margin-top:16px}
.takebox{background:var(--soft);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.takebox p{margin:0 0 10px;max-width:66ch}
.takebox p:last-child{margin:0}
.files-link{font-family:var(--font-head);font-size:.85rem;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:4px 14px}
.files-link:hover{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion: no-preference){
  .card,.lead{animation:rise .45s ease-out both}
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
  .art{animation:pop .3s ease-out both}
  @keyframes pop{from{transform:translateY(16px) scale(.98)}to{transform:none}}
}
</style>
</head>
<body>
<div class="topbar"></div>
<header class="mast">
  <div class="mast-in">
    <a href="./" id="homelink" title="الرئيسية" style="display:flex;align-items:center;gap:inherit;color:inherit;text-decoration:none"><img src="images/logo.jpg" alt="شعار قهوة المصريين" width="64" height="64">
    <h1>١٤ مليون</h1></a>
    <a class="files-link" href="#files-sec" id="fileslink" hidden>ملفات مفتوحة</a>
    <p class="stamp" id="stamp" style="margin-inline-start:auto"></p>
    <button class="theme-btn" id="themebtn" type="button" aria-label="تبديل الوضع الغامق والفاتح"></button>
  </div>
</header>

<nav class="rail" aria-label="تصفية الأخبار">
  <div class="rail-in">
    <div class="cats" id="cats" role="group" aria-label="الأقسام"></div>
    <div class="sort" id="sort" role="group" aria-label="ترتيب الأخبار"><span>رتّب:</span><button type="button" class="cat" data-s="ours" aria-pressed="true">ترتيبنا</button><button type="button" class="cat" data-s="new" aria-pressed="false">الأحدث</button><button type="button" class="cat" data-s="impact" aria-pressed="false">الأهم أثراً</button></div>
    <div class="tools">
      <label for="q" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">بحث</label>
      <input id="q" type="search" placeholder="ابحث في الأخبار">
      <label for="country" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">البلد</label>
      <select id="country"><option value="">كل البلاد</option></select>
    </div>
  </div>
</nav>

<main>
  <section class="files" id="files-sec" hidden aria-labelledby="files-title">
    <div class="files-head"><h2 id="files-title">ملفات مفتوحة</h2><p>تقارير مطولة ترصد ما يواجهه المصريون في الخارج. لا تختفي، ونحدّثها كلما جدّ جديد.</p></div>
    <div class="files-row" id="filesrow"></div>
  </section>
  <section id="leadwrap"></section>
  <section class="grid" id="grid" aria-live="polite"></section>
  <button class="more" id="more" type="button" hidden>عرض المزيد</button>
</main>
<footer><div class="in" id="foot"></div></footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="art-title">
  <article class="art" id="art"></article>
</div>

<script>
(function(){
  var CATS = {
    "تصريحات رسمية": {k:"var(--c-said)",  d:"تصريحات وقرارات رسمية عن المصريين بالخارج."},
    "من الواقع": {k:"var(--c-real)",  d:"ما حدث فعلاً للمصريين بالخارج."},
    "وعود وواقع": {k:"var(--c-gap)",   d:"المسافة بين ما وُعد به وما تحقق."},
    "حقوق وحريات": {k:"var(--c-rights)",d:"الجنسية والجوازات والوثائق والحريات."},
    "اقتصاد": {k:"var(--c-money)", d:"التحويلات والرسوم وأين تذهب."},
    "رياضة": {k:"#1f6f8b", d:"رياضيون مصريون بين البعثات والتجنيس."}
  };
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var PAGE = 12, shown = PAGE, state = {cat:"", q:"", country:""}, data = null, live = [], reports = [];
  (function(){var b=document.getElementById('themebtn'),R=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
    function cur(){var t=R.getAttribute('data-theme'); return t==='dark'?'dark':'light';}
    function paint(){var d=cur()==='dark'; b.textContent=d?'☀︎ فاتح':'☾ غامق'; var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',d?'#121212':'#ffffff'); var cs=document.querySelector('meta[name="color-scheme"]'); if(cs) cs.setAttribute('content',d?'dark':'only light'); R.style.colorScheme=d?'dark':'only light';}
    b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark'; R.setAttribute('data-theme',n); try{localStorage.setItem('theme14',n);}catch(e){} paint();});
    if(mq&&mq.addEventListener) mq.addEventListener('change',paint); paint();})();
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
  function nice(iso){var p=iso.split('-'); return (+p[2])+' '+MONTHS[+p[1]-1]+' '+p[0];}
  function left(iso){iso=iso||'';var p=iso.split('-'),n=new Date();
    return data.ttl_days-Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(+p[0],+p[1]-1,+p[2]))/864e5);}
  function kOf(c){return (CATS[c]||{k:"var(--ink)"}).k;}
  function cover(x){
    var c=el('div','cover'); c.style.setProperty('--k',kOf(x.cat));
    if(x.image){var i=el('img'); i.src=x.image; i.alt=x.image_alt||''; i.loading='lazy'; i.referrerPolicy='no-referrer'; c.appendChild(i);}
    else{c.classList.add('gen'); if(x.cat==='تصريحات رسمية') c.classList.add('dark'); c.appendChild(el('span','k',x.kicker||'')); c.appendChild(el('span','w',x.cat||'خبر'));}
    return c;
  }
  function meta(x){
    var m=el('div','meta'); if(x.priority===1){m.appendChild(el('span','urg','عاجل'));} if(x.pin_top){m.appendChild(el('span','urg pin','مثبّت'));} var p=el('span','pill',x.cat); p.style.setProperty('--k',kOf(x.cat)); m.appendChild(p);
    m.appendChild(el('span',null,(x.countries||[]).join(' · '))); m.appendChild(el('span',null,nice(x.date)));
    var t=x._left===0?'يختفي اليوم':x._left===1?'يختفي غداً':'يختفي بعد '+x._left+' أيام';
    m.appendChild(el('span','fade'+(x._left<=1?' last':''),t)); return m;
  }
  function excerpt(x){if(x.political){var t=x.political.split('\n').filter(function(l){return l.trim()&&l.trim()[0]!=='#';}).slice(0,3).join(' '); if(t) return t;} return (x.news&&x.news[0])||(x.story&&x.story[0])||'';}
  function bydate(a,b){ if((a.published||'')!==(b.published||'')) return a.published<b.published?1:-1; if((a.date||'')!==(b.date||'')) return a.date<b.date?1:-1; return (a.order||0)-(b.order||0); }
  function sorted(list){
    var s=state.sort||'ours'; if(s==='ours') return list;
    list=list.slice();
    if(s==='new') list.sort(function(a,b){ var d=bydate(a,b); return d||((a.priority||4)-(b.priority||4)); });
    else list.sort(function(a,b){ var pa=a.priority||4, pb=b.priority||4; if(pa!==pb) return pa-pb; return bydate(a,b); });
    return list;
  }
  function filtered(){
    var q=state.q.trim();
    return sorted(live.filter(function(x){
      if(state.cat && x.cat!==state.cat) return false;
      if(state.country && (x.countries||[]).indexOf(state.country)<0) return false;
      if(q){var hay=[x.title,x.kicker,x.political||'',(x.news||[]).join(' '),(x.story||[]).join(' ')].join(' '); if(hay.indexOf(q)<0) return false;}
      return true;
    }));
  }
  function renderCats(){
    var box=document.getElementById('cats'); box.textContent='';
    [""].concat(Object.keys(CATS)).forEach(function(c){
      var n=live.filter(function(x){return !c||x.cat===c;}).length;
      var b=el('button','cat',(c||'الكل')+' '+n); b.type='button'; b.setAttribute('aria-pressed',String(state.cat===c));
      if(c) b.style.setProperty('--k',kOf(c));
      b.addEventListener('click',function(){state.cat=c; shown=PAGE; render();}); box.appendChild(b);
    });
  }
  function renderFiles(){
    var sec=document.getElementById('files-sec'), row=document.getElementById('filesrow'); row.textContent='';
    var list=reports.filter(function(x){ if(state.cat||state.q) return false; if(state.country&&(x.countries||[]).indexOf(state.country)<0) return false; return true; });
    sec.hidden=!list.length; document.getElementById('fileslink').hidden=!reports.length;
    list.forEach(function(x){
      var c=el('button','file'); c.type='button'; c.appendChild(cover(x));
      var t=el('div','txt'); var m=el('div','meta'); m.appendChild(el('span','tag','ملف'));
      m.appendChild(el('span',null,(x.countries||[]).join(' · '))); if(x.period) m.appendChild(el('span',null,x.period));
      if(x.updated) m.appendChild(el('span',null,'آخر تحديث '+nice(x.updated.slice(0,10))));
      t.appendChild(m); t.appendChild(el('h3',null,x.title)); t.appendChild(el('p','ex',x.summary||'')); c.appendChild(t);
      c.addEventListener('click',function(){open(x.id);}); row.appendChild(c);
    });
  }
  function showReport(x){
    var a=document.getElementById('art'); a.textContent='';
    var bar=el('div','art-bar'); var cl=el('button',null,'إغلاق'); cl.type='button'; cl.addEventListener('click',close);
    var sh=el('button',null,'نسخ رابط الملف'); sh.type='button';
    sh.addEventListener('click',function(){ try{navigator.clipboard.writeText(location.href).then(function(){sh.textContent='تم النسخ';},function(){sh.textContent=location.href;});}catch(e){sh.textContent=location.href;} });
    bar.appendChild(cl); bar.appendChild(sh); a.appendChild(bar); a.appendChild(cover(x));
    var i=el('div','art-in'); var m=el('div','meta'); m.appendChild(el('span','tag','ملف مفتوح'));
    m.appendChild(el('span',null,(x.countries||[]).join(' · '))); if(x.period) m.appendChild(el('span',null,x.period));
    if(x.updated) m.appendChild(el('span',null,'آخر تحديث '+nice(x.updated.slice(0,10)))); i.appendChild(m);
    var h=el('h2',null,x.title); h.id='art-title'; i.appendChild(h);
    var b=el('div','rep'); if(x.summary) b.appendChild(el('p','lede',x.summary));
    (x.sections||[]).forEach(function(sc){ b.appendChild(el('h3',sc.kind==='hope'?'hope':null,sc.h)); (sc.p||[]).forEach(function(p){b.appendChild(el('p',null,p));}); });
    i.appendChild(b);
    if(x.sources&&x.sources.length){var s=el('div','srcs'); s.appendChild(el('strong',null,'المصادر')); var ul=el('ul');
      x.sources.forEach(function(q){var li=el('li'); var l=el('a',null,q.name); l.href=q.url; l.target='_blank'; l.rel='noopener'; li.appendChild(l); ul.appendChild(li);});
      s.appendChild(ul); i.appendChild(s);}
    a.appendChild(i);
    var sheet=document.getElementById('sheet'); sheet.dataset.open='1'; sheet.scrollTop=0; document.body.style.overflow='hidden'; cl.focus();
  }
  function render(){
    renderFiles();
    renderCats();
    var list=filtered(), lw=document.getElementById('leadwrap'), g=document.getElementById('grid'); lw.textContent=''; g.textContent='';
    if(!list.length){g.appendChild(el('p','empty','لا توجد أخبار تطابق اختيارك الآن. كل خبر يختفي بعد خمسة أيام من نشره.'));}
    var rest=list;
    if(!state.cat && !state.q && !state.country && list.length){
      var lead=((state.sort||'ours')==='ours'&&list.filter(function(x){return x.lead;})[0])||list[0]; rest=list.filter(function(x){return x!==lead;});
      var L=el('article','lead'); L.tabIndex=0; L.setAttribute('role','button');
      L.appendChild(cover(lead)); var t=el('div','lead-text'); t.appendChild(meta(lead)); t.appendChild(el('h2',null,lead.title)); t.appendChild(el('p',null,excerpt(lead)));
      L.appendChild(t); L.addEventListener('click',function(){open(lead.id);});
      L.addEventListener('keydown',function(e){if(e.key==='Enter') open(lead.id);}); lw.appendChild(L);
    }
    rest.slice(0,shown).forEach(function(x){
      var c=el('button','card'); c.type='button'; c.appendChild(cover(x));
      var t=el('div','txt'); t.appendChild(meta(x)); t.appendChild(el('h3',null,x.title)); t.appendChild(el('p','ex',excerpt(x))); c.appendChild(t);
      c.addEventListener('click',function(){open(x.id);}); g.appendChild(c);
    });
    document.getElementById('more').hidden = rest.length<=shown;
  }
  function open(id){ if(location.hash!=='#'+id) location.hash=id; else show(id); }
  function close(){ history.replaceState(null,'',location.pathname+location.search); hide(); }
  function hide(){ var s=document.getElementById('sheet'); s.dataset.open='0'; document.body.style.overflow=''; }
  function show(id){
    var x=live.filter(function(i){return i.id===id;})[0];
    if(!x){ var r=reports.filter(function(i){return i.id===id;})[0]; if(r){showReport(r);} else hide(); return; }
    var a=document.getElementById('art'); a.textContent='';
    var bar=el('div','art-bar'); var cl=el('button',null,'إغلاق'); cl.type='button'; cl.addEventListener('click',close);
    var sh=el('button',null,'نسخ رابط الخبر'); sh.type='button';
    sh.addEventListener('click',function(){ try{navigator.clipboard.writeText(location.href).then(function(){sh.textContent='تم النسخ';},function(){sh.textContent=location.href;});}catch(e){sh.textContent=location.href;} });
    bar.appendChild(cl); bar.appendChild(sh); a.appendChild(bar);
    a.appendChild(cover(x));
    if(x.image_credit){var cr=el('p','credit'); if(x.image_page){var cl2=el('a',null,x.image_credit); cl2.href=x.image_page; cl2.target='_blank'; cl2.rel='noopener'; cr.appendChild(cl2);} else cr.textContent=x.image_credit; a.appendChild(cr);}
    var i=el('div','art-in'); i.appendChild(meta(x)); var h=el('h2',null,x.title); h.id='art-title'; i.appendChild(h);
    if(x.sections&&x.sections.length){ if(x.political) i.appendChild(el('p','pol',x.political)); var rb=el('div','rep'); x.sections.forEach(function(sc){ rb.appendChild(el('h3',sc.kind==='hope'?'hope':(sc.kind==='take'?'takeh':null),sc.h)); var bx=sc.kind==='take'?el('div','takebox'):rb; (sc.p||[]).forEach(function(p){bx.appendChild(el('p',null,p));}); if(bx!==rb) rb.appendChild(bx); }); i.appendChild(rb); }
    else if(x.political){ i.appendChild(el('p','pol',x.political)); if(x.news&&x.news.length){var pl=el('div','plain'); x.news.forEach(function(p){pl.appendChild(el('p',null,p));}); i.appendChild(pl);} }
    else { var b=el('div','story'); var st=x.story||[]; st.forEach(function(p,n){b.appendChild(el('p',n===st.length-1&&st.length>1?'take':null,p));}); i.appendChild(b); }
    if(x.sources&&x.sources.length){var s=el('div','srcs'); s.appendChild(el('strong',null,'المصادر')); var ul=el('ul');
      x.sources.forEach(function(q){var li=el('li'); var l=el('a',null,q.name); l.href=q.url; l.target='_blank'; l.rel='noopener'; li.appendChild(l); ul.appendChild(li);});
      s.appendChild(ul); i.appendChild(s);}
    a.appendChild(i);
    var sheet=document.getElementById('sheet'); sheet.dataset.open='1'; sheet.scrollTop=0; document.body.style.overflow='hidden'; cl.focus();
  }
  function route(){ var id=location.hash.replace('#',''); if(id==='files-sec'){hide(); return;} if(id) show(decodeURIComponent(id)); else hide(); }
  document.getElementById('sheet').addEventListener('click',function(e){ if(e.target.id==='sheet') close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && document.getElementById('sheet').dataset.open==='1') close(); });
  window.addEventListener('hashchange',route);
  try{var sv=localStorage.getItem('14m-sort'); if(sv==='new'||sv==='impact') state.sort=sv;}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('#sort .cat'),function(b){
    b.setAttribute('aria-pressed',String((state.sort||'ours')===b.dataset.s));
    b.addEventListener('click',function(){ state.sort=b.dataset.s; try{localStorage.setItem('14m-sort',state.sort);}catch(e){}
      Array.prototype.forEach.call(document.querySelectorAll('#sort .cat'),function(o){o.setAttribute('aria-pressed',String(o===b));}); shown=PAGE; render(); });
  });
  document.getElementById('more').addEventListener('click',function(){shown+=PAGE; render();});
  var qt; document.getElementById('q').addEventListener('input',function(e){clearTimeout(qt); qt=setTimeout(function(){state.q=e.target.value; shown=PAGE; render();},200);});
  document.getElementById('country').addEventListener('change',function(e){state.country=e.target.value; shown=PAGE; render();});

  fetch('data.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    data=d;
    if(d.cat_desc){Object.keys(d.cat_desc).forEach(function(k){ if(CATS[k]&&d.cat_desc[k]) CATS[k].d=d.cat_desc[k]; });}
    if(d.site_title){var h1=document.querySelector('.mast h1'); if(h1) h1.textContent=d.site_title;}
    reports=(d.reports||[]).slice();
    live=(d.items||[]).map(function(x){x._left=left(x.published||x.date); return x;}).filter(function(x){return x._left>=0;});
    live.sort(function(a,b){
      if(!!a.lead!==!!b.lead) return a.lead?-1:1;
      if(typeof a.order==='number'&&typeof b.order==='number') return a.order-b.order;
      if(!!a.pin_top!==!!b.pin_top) return a.pin_top?-1:1;
      if((a.priority||4)!==(b.priority||4)) return (a.priority||4)-(b.priority||4);
      if((a.published||'')!==(b.published||'')) return a.published<b.published?1:-1;
      return a.date<b.date?1:-1;
    });
    document.getElementById('stamp').textContent='آخر تحديث '+nice((d.updated||'').slice(0,10));
    var cs={}; live.concat(reports).forEach(function(x){(x.countries||[]).forEach(function(c){cs[c]=1;});});
    var sel=document.getElementById('country'); Object.keys(cs).sort().forEach(function(c){var o=el('option',null,c); o.value=c; sel.appendChild(o);});
    document.getElementById('foot').textContent=d.about||'';
    render(); route();
    fetch('reports.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(rj){
      if(rj&&rj.reports&&rj.reports.length){ reports=rj.reports.slice(); }
      reports.sort(function(a,b){return (a.updated||'')<(b.updated||'')?1:-1;});
      var sel=document.getElementById('country'), have={}; Array.prototype.forEach.call(sel.options,function(o){have[o.value]=1;});
      reports.forEach(function(x){(x.countries||[]).forEach(function(c){ if(!have[c]){have[c]=1; var o=el('option',null,c); o.value=c; sel.appendChild(o);} });});
      render(); route();
    }).catch(function(){});
  }).catch(function(){
    document.getElementById('stamp').textContent='تعذّر تحميل الأخبار. أعد فتح الصفحة بعد قليل.';
  });
})();
</script>
</body>
</html>
